[metadata]
name = comparateur_prix
description = Comparateur de prix avec ML et Celery
author = Votre Nom
license = MIT

[flake8]
max-line-length = 100
exclude = 
    .git,
    __pycache__,
    venv,
    .venv,
    migrations,
    manage.py,
    settings.py,
    wsgi.py,
    asgi.py
ignore = 
    E203,  # whitespace before ':'
    E501,  # line too long (handled by black)
    W503,  # line break before binary operator
    E402,  # module level import not at top of file
per-file-ignores =
    __init__.py:F401
max-complexity = 10

[pylint]
[MESSAGES CONTROL]
disable = 
    C0111,  # missing-docstring
    C0103,  # invalid-name
    R0903,  # too-few-public-methods
    R0913,  # too-many-arguments
    W0212,  # protected-access

[FORMAT]
max-line-length = 100

[MASTER]
ignore = migrations,venv,.venv

[pylint.messages_control]
disable = 
    missing-docstring,
    too-few-public-methods,
    too-many-arguments

[isort]
profile = black
line_length = 100
skip = migrations,venv,.venv
known_first_party = apps,config
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
exclude = 
    migrations,
    venv,
    .venv

[coverage:run]
source = .
omit = 
    */migrations/*,
    */tests/*,
    */venv/*,
    */__pycache__/*,
    manage.py,
    */settings.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

